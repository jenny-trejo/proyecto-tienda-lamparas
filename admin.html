<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Administrador - Tienda Lumina</title>
    <link rel="stylesheet" href="styles.css"> <style>
        /* Estilos adicionales específicos para el admin */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .admin-card {
            background-color: #1a252f;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 80%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            color: white;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 15px;
            text-align: left;
        }

        .action-btn {
            padding: 5px 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            color: white;
            margin-right: 5px;
        }

        .edit-btn { background-color: #f39c12; }
        .delete-btn { background-color: #c0392b; }
        .stock-btn { background-color: #27ae60; }

        input[type="file"] {
            color: #ddd;
        }

        input[type="checkbox"] {
            margin-left: 10px;
        }
    </style>
</head>
